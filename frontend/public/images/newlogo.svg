<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e7e9eb"/>
      <stop offset="100%" stop-color="#b9bec3"/>
    </linearGradient>
    <linearGradient id="blueSwoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a3a8f"/>
      <stop offset="50%" stop-color="#2f7fd6"/>
      <stop offset="100%" stop-color="#6fc7f0"/>
    </linearGradient>
    <linearGradient id="mainText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7dade"/>
    </linearGradient>
  </defs>

  <!-- blue circular swoosh behind car -->
  <path d="M 150 260
           A 190 190 0 1 1 430 415"
        fill="none" stroke="url(#blueSwoosh)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 165 300
           A 155 155 0 0 1 60 230"
        fill="none" stroke="url(#blueSwoosh)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- gear cog behind wheel -->
  <g fill="#5aa6d6" opacity="0.85">
    <circle cx="245" cy="255" r="44"/>
    <g>
      <rect x="240" y="200" width="10" height="16"/>
      <rect x="240" y="294" width="10" height="16"/>
      <rect x="192" y="248" width="16" height="10"/>
      <rect x="282" y="248" width="16" height="10"/>
      <rect x="207" y="212" width="10" height="16" transform="rotate(45 212 220)"/>
      <rect x="270" y="212" width="10" height="16" transform="rotate(-45 275 220)"/>
      <rect x="207" y="284" width="10" height="16" transform="rotate(-45 212 292)"/>
      <rect x="270" y="284" width="10" height="16" transform="rotate(45 275 292)"/>
    </g>
  </g>
  <circle cx="245" cy="255" r="26" fill="#0c2d4a"/>

  <!-- car silhouette (side/front-quarter sports coupe) -->
  <path d="M40 300
           C 55 265, 90 250, 120 248
           C 150 210, 210 178, 270 172
           C 330 166, 380 178, 415 205
           C 440 200, 465 205, 480 220
           C 500 218, 520 225, 528 240
           L 528 262
           C 528 270, 522 276, 514 276
           L 488 276
           C 480 292, 462 302, 442 302
           L 300 302
           C 292 316, 274 326, 254 326
           C 234 326, 216 316, 208 302
           L 130 302
           C 110 302, 92 292, 82 278
           L 55 278
           C 46 278, 38 270, 38 261
           Z"
        fill="url(#carBody)" stroke="#8f959b" stroke-width="2"/>
  <!-- windows -->
  <path d="M175 214 C 215 190, 270 182, 320 190 C 340 194, 355 202, 365 212 L 300 214 Z"
        fill="#0c2d4a"/>
  <path d="M375 214 L 415 212 C 432 215, 445 222, 452 232 L 380 234 Z" fill="#0c2d4a"/>
  <!-- front wheel -->
  <circle cx="150" cy="300" r="34" fill="#22282e"/>
  <circle cx="150" cy="300" r="18" fill="#aeb4b9"/>
  <!-- rear wheel -->
  <circle cx="420" cy="300" r="30" fill="#22282e"/>
  <circle cx="420" cy="300" r="16" fill="#aeb4b9"/>
  <!-- headlight accent -->
  <path d="M60 262 C 68 256, 82 254, 92 258 L 88 270 C 78 272, 66 270, 58 266 Z" fill="#6fc7f0"/>

  <!-- text -->
  <text x="545" y="288" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="86" letter-spacing="2" fill="url(#mainText)">SPARKLE</text>
  <text x="555" y="330" font-family="Arial, sans-serif" font-weight="700"
        font-size="34" letter-spacing="10" fill="url(#blueSwoosh)">WASH</text>
</svg>
