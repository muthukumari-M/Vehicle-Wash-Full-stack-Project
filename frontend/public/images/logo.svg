<svg viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a6ea8"/>
      <stop offset="45%" stop-color="#7fb3d9"/>
      <stop offset="70%" stop-color="#dfe7ee"/>
      <stop offset="100%" stop-color="#5b6b7a"/>
    </linearGradient>
    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c4a68"/>
      <stop offset="100%" stop-color="#4a5a68"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcd7ea"/>
      <stop offset="55%" stop-color="#3f7bab"/>
      <stop offset="100%" stop-color="#1f3d55"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b98a3"/>
      <stop offset="100%" stop-color="#3c454d"/>
    </linearGradient>
    <linearGradient id="gunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fa3c9"/>
      <stop offset="100%" stop-color="#1c3a54"/>
    </linearGradient>
    <linearGradient id="sprayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9fb1bd"/>
      <stop offset="100%" stop-color="#e8eef2"/>
    </linearGradient>
  </defs>

  <!-- car roofline swoosh -->
  <path d="M110 300 C 260 300, 300 210, 400 205 C 470 202, 520 230, 560 270 C 610 270, 660 275, 700 285"
        fill="none" stroke="url(#carGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M150 320 C 300 340, 420 335, 520 300 C 600 275, 660 300, 720 305"
        fill="none" stroke="url(#grayGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#eaf3fa">
    <path d="M640 165 l6 22 22 6 -22 6 -6 22 -6 -22 -22 -6 22 -6 z"/>
    <path d="M700 210 l4 15 15 4 -15 4 -4 15 -4 -15 -15 -4 15 -4 z"/>
    <path d="M700 260 l3 11 11 3 -11 3 -3 11 -3 -11 -11 -3 11 -3 z"/>
  </g>

  <!-- main title -->
  <text x="60" y="410" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-style="italic" font-size="108" letter-spacing="2" fill="url(#textGrad)">SPARKLE WASH</text>

  <!-- subtitle -->
  <text x="330" y="455" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-style="italic" font-size="42" letter-spacing="3" fill="url(#textGradDark)">DETAILING</text>

  <!-- pressure washer gun -->
  <g fill="url(#gunGrad)">
    <path d="M170 400
             C 178 388, 200 384, 222 388
             L 300 392
             C 315 393, 325 400, 330 410
             L 332 418
             L 250 424
             L 250 470
             C 250 480, 242 488, 232 488
             C 222 488, 214 480, 214 470
             L 214 430
             C 195 428, 178 418, 172 408 Z"/>
    <rect x="330" y="400" width="30" height="16" rx="4"/>
  </g>

  <!-- hose / spray lines to the right -->
  <g fill="none" stroke="url(#sprayGrad)" stroke-width="6" stroke-linecap="round">
    <path d="M360 408 C 420 408, 470 400, 520 408"/>
    <path d="M520 408 C 560 408, 590 398, 615 385"/>
    <path d="M520 408 C 560 412, 590 420, 612 432"/>
    <path d="M520 408 C 555 408, 580 410, 600 410"/>
    <path d="M520 408 C 550 400, 565 388, 575 372"/>
    <path d="M520 408 C 548 416, 562 428, 568 444"/>
  </g>
</svg>
